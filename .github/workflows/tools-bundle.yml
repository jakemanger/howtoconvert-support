name: Build conversion tools

# Runs only when started by hand from the Actions tab. It never publishes a
# public release: with "draft" ticked it creates a *draft* release that you
# review and publish yourself.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Comma-separated platforms, or all
        type: string
        required: true
        default: mac_arm64,windows_x86_64
      draft:
        description: Create a draft GitHub release with the assets
        type: boolean
        default: false
      input_cache_url:
        description: Optional HTTPS base URL for checksum-addressed build inputs
        type: string
        default: ""

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.selection.outputs.platforms }}
      windows: ${{ steps.selection.outputs.windows }}
      portable_libreoffice: ${{ steps.libreoffice.outputs.portable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate platform selection
        id: selection
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: node tools-bundle/scripts/select-platforms.mjs
      - name: Check whether LibreOffice needs packaging
        id: libreoffice
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('tools-bundle/bundle.config.json')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'portable='+(c.tools.libreoffice.platforms.windows_x86_64.package.delivery !== 'direct')+'\n');"
      - name: Test packaging and release checks
        run: node --test tools-bundle/scripts/*.test.mjs
      - name: Test TeX source reconstruction
        run: python3 tools-bundle/tex/test-sources.py
      - name: Check required source mappings before building
        env:
          TARGET_PLATFORMS: ${{ steps.selection.outputs.platforms }}
        run: node tools-bundle/scripts/build-bundle.mjs --check --platform "$TARGET_PLATFORMS"

  windows-libreoffice:
    needs: validate
    if: ${{ needs.validate.outputs.windows == 'true' && needs.validate.outputs.portable_libreoffice == 'true' }}
    # Extract with the Windows administrative installer.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch prepared Windows inputs
        if: ${{ inputs.input_cache_url != '' }}
        shell: bash
        env:
          INPUT_CACHE_URL: ${{ inputs.input_cache_url }}
        run: node tools-bundle/scripts/input-cache.mjs fetch --url "$INPUT_CACHE_URL" --only libreoffice --platform windows_x86_64
      - name: Build portable LibreOffice for Windows
        run: node tools-bundle/scripts/build-bundle.mjs --out dist --platform windows_x86_64 --only libreoffice
      - uses: actions/upload-artifact@v4
        with:
          name: windows-libreoffice
          path: dist/libreoffice-*-windows_x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [validate, windows-libreoffice]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.windows-libreoffice.result == 'success' || needs.windows-libreoffice.result == 'skipped') }}
    env:
      TARGET_PLATFORMS: ${{ needs.validate.outputs.platforms }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full xz-utils
      - uses: actions/download-artifact@v4
        if: ${{ needs.windows-libreoffice.result == 'success' }}
        with:
          name: windows-libreoffice
          path: dist
      - name: Fetch prepared build inputs
        if: ${{ inputs.input_cache_url != '' }}
        env:
          INPUT_CACHE_URL: ${{ inputs.input_cache_url }}
        run: node tools-bundle/scripts/input-cache.mjs fetch --url "$INPUT_CACHE_URL" --platform "$TARGET_PLATFORMS"
      - name: Build packages, sources and manifest
        run: node tools-bundle/scripts/build-bundle.mjs --out dist --reuse --link --platform "$TARGET_PLATFORMS"
      - name: Sign the manifest
        env:
          TOOLS_MANIFEST_SIGNING_KEY: ${{ secrets.TOOLS_MANIFEST_SIGNING_KEY }}
        run: |
          if [ -z "$TOOLS_MANIFEST_SIGNING_KEY" ]; then
            echo "::error::Add the TOOLS_MANIFEST_SIGNING_KEY secret (create it with tools-bundle/scripts/generate-signing-key.mjs)."
            exit 1
          fi
          node tools-bundle/scripts/sign-manifest.mjs dist
      - name: Verify and stage release files
        env:
          TOOLS_MANIFEST_PUBLIC_KEY: ${{ vars.TOOLS_MANIFEST_PUBLIC_KEY }}
        run: node tools-bundle/scripts/stage-release.mjs dist release --vendor-dir .bundle-work/downloads --link
      - uses: actions/upload-artifact@v4
        with:
          name: tools-bundle
          path: release
          retention-days: 14
      - name: Create draft release
        if: ${{ inputs.draft }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE=$(node -p "require('./tools-bundle/bundle.config.json').bundle")
          gh release create "$BUNDLE" release/* --target "$GITHUB_SHA" --draft --title "Conversion tools $BUNDLE" --notes "Prebuilt command-line conversion tools for the selected platforms save you from finding or compiling each tool yourself. Sources and licenses are in SOURCES.md."
