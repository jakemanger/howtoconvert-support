summary: ISO/IEC 23008-12:2017 HEIF file format decoder and encoder
web-url: https://www.libde265.org/
src-url: https://github.com/strukturag/libheif/releases/download/v1.23.7/libheif-1.23.7.tar.gz
src-sha: f7483e818503ea6224c8863e4a56ac02c7089021a98472c811c12aa19faf2475
license: LGPL-3.0-only
dep-pkg: libde265 libx265 librav1e libdav1d libaom libSvtAv1

install: |
    cmakew 2 \
        -DWITH_EXAMPLES=OFF \
        -DWITH_X264=OFF \
        -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
        -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
        -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY
